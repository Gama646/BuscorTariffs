<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscor – Payment Cancelled</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #000;
      padding: 40px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    .logo  { display: block; width: auto; height: 112px; max-width: 100%; object-fit: contain; filter: grayscale(1) contrast(1.5); margin: 0 auto 28px; }
    .icon  { font-size: 3rem; filter: grayscale(1); margin-bottom: 16px; }
    h2     { color: #000; font-size: 1.4rem; margin-bottom: 12px; }
    p      { color: #000; font-size: 0.95rem; line-height: 1.6; margin-bottom: 8px; }
    .ref   { font-size: 0.82rem; color: #000; margin: 12px 0 28px; }

    .btn {
      display: inline-block;
      padding: 11px 28px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      margin: 6px;
    }
    .btn-primary   { background: #000; color: #fff; }
    .btn-secondary { background: #fff; color: #000; border: 1px solid #000; }
    .btn-primary:hover   { background: #000; }
    .btn-secondary:hover { background: #fff; }
  </style>
</head>
<body>
<div class="card">
  <img class="logo" src="/public/buscor_logoBlacknWhite.png" alt="Buscor (Pty) Ltd" />
  <div class="icon">⚠️</div>
  <h2>Payment Cancelled</h2>
  <p>You cancelled the payment. No money was taken and no trips were loaded onto your card.</p>
  <p class="ref" id="ref-line"></p>
  <a class="btn btn-primary"   href="/">Try Again</a>
  <a class="btn btn-secondary" href="/">Back to Home</a>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const txId   = params.get('txId');
  if (txId) {
    document.getElementById('ref-line').textContent = `Reference: ${txId}`;
  }
</script>
</body>
</html>
